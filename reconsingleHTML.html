<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recon 360 — Client Health</title>
<script>
try { if (localStorage.getItem('recon360-theme') === 'dark') document.documentElement.classList.add('dark'); } catch (e) {}
</script>
<style>
/* ============================================================
   DESIGN TOKENS — mirrors apps/web/src/app/globals.css exactly
   ============================================================ */
:root{
  --background:#f6f7f9; --foreground:#0f1420; --card:#ffffff; --card-foreground:#0f1420;
  --muted:#eef1f5; --muted-foreground:#586173; --border:#e5e9f0;
  --brand-blue:#2f6df6; --brand-green:#189a5b; --brand-amber:#cf8500; --brand-red:#d6453a; --brand-purple:#7a55d6;
  --shadow:0 1px 3px rgba(15,20,32,.06),0 10px 30px rgba(15,20,32,.05);
}
html.dark{
  --background:#0b0e14; --foreground:#e8ebf0; --card:#12151d; --card-foreground:#e8ebf0;
  --muted:#171c26; --muted-foreground:#a6b0bf; --border:#28303d;
  --brand-blue:#5b8cff; --brand-green:#2fbf76; --brand-amber:#e0a03a; --brand-red:#e2685f; --brand-purple:#9575e0;
  --shadow:0 1px 3px rgba(0,0,0,.45),0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--background); color:var(--foreground); line-height:1.5; font-size:14px;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px}

/* ============================================================
   LAYOUT — sidebar (nav-bar.tsx) + top bar (top-bar.tsx) + main
   ============================================================ */
#app{display:flex;min-height:100vh}

.sidebar{position:sticky;top:0;align-self:flex-start;height:100vh;width:240px;flex-shrink:0;display:flex;flex-direction:column;background:#0a0d0a;color:#fff}
.sidebar-logo{padding:20px 16px 16px}
.sidebar-logo-inner{display:flex;align-items:center;gap:10px;border:1px solid rgba(50,219,134,.4);background:rgba(255,255,255,.03);border-radius:8px;padding:10px 12px;cursor:pointer}
.sidebar-logo-mark{display:grid;place-items:center;width:28px;height:28px;border-radius:6px;border:1px solid rgba(50,219,134,.5);flex-shrink:0;overflow:hidden}
.sidebar-logo-mark svg{width:20px;height:20px}
.sidebar-logo-text{line-height:1.25}
.sidebar-logo-title{font-size:17px;font-weight:700;color:#fff}
.sidebar-logo-title span{color:#32DB86}
.sidebar-logo-sub{font-size:9px;font-weight:600;letter-spacing:.09em;color:rgba(255,255,255,.4);text-transform:uppercase}
.sidebar-nav{flex:1;padding:10px 12px 0;display:flex;flex-direction:column;gap:2px}
.sidebar-nav a{display:flex;align-items:center;gap:10px;border-radius:6px;padding:9px 12px;font-size:13px;font-weight:500;color:rgba(255,255,255,.65);cursor:pointer}
.sidebar-nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.sidebar-nav a.active{background:rgba(50,219,134,.15);color:#32DB86}
.sidebar-nav a .nicon{width:16px;text-align:center;flex-shrink:0;font-size:13px}
.sidebar-footer{border-top:1px solid rgba(255,255,255,.1);padding:16px}
.theme-toggle{display:flex;align-items:center;width:36px;height:20px;border-radius:999px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.1);padding:2px;cursor:pointer;margin-bottom:12px}
.theme-toggle.is-dark{background:rgba(50,219,134,.35);justify-content:flex-end}
.theme-toggle .knob{width:14px;height:14px;border-radius:999px;background:#fff;display:grid;place-items:center;font-size:9px;color:#0a0d0a}
.user-chip{display:flex;align-items:center;gap:8px}
.user-avatar{display:grid;place-items:center;width:28px;height:28px;border-radius:999px;background:rgba(255,255,255,.1);color:#fff;font-size:11px;font-weight:700;flex-shrink:0}
.user-name{font-size:12px;font-weight:600;color:#fff}
.user-role{font-size:10px;color:rgba(255,255,255,.45)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);background:var(--card);padding:11px 24px;gap:14px;flex-wrap:wrap}
.topbar-title{font-size:13px;font-weight:600;flex-shrink:0}
.topbar-right{display:flex;flex:1;align-items:center;justify-content:flex-end;gap:10px;min-width:0}
.topbar-search{position:relative;flex:1;min-width:200px;max-width:480px}
.topbar-search input{width:100%;border:1px solid var(--border);background:var(--background);border-radius:6px;padding:7px 12px 7px 30px;font-size:13px;color:var(--foreground);outline:none}
.topbar-search input:focus{border-color:var(--brand-blue)}
.topbar-search .sicon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted-foreground);font-size:12px;pointer-events:none}
.demo-tag{border:1px dashed var(--border);border-radius:6px;padding:4px 8px;font-family:ui-monospace,"SF Mono",Consolas,monospace;font-size:9px;color:var(--muted-foreground);white-space:nowrap;flex-shrink:0}
.content{flex:1;min-width:0;padding:14px 24px 64px}

h1.page-title{font-size:24px;font-weight:600;letter-spacing:-.01em;margin:8px 0 4px}
p.page-sub{color:var(--muted-foreground);font-size:13.5px;margin:0 0 18px;max-width:720px}
.kpi-badges{display:flex;justify-content:flex-end;gap:8px;margin-bottom:14px;flex-wrap:wrap}

/* ============================================================
   CARD / TABLE / BADGE PRIMITIVES
   ============================================================ */
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow)}
.card-pad{padding:20px}
.card-header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);padding:14px 18px;gap:10px;flex-wrap:wrap}
.card-header-title{font-size:13px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--muted-foreground)}
.card-footnote{padding:0 16px 14px;font-size:11.5px;color:var(--muted-foreground)}

.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted-foreground);font-weight:600;padding:10px 16px;border-bottom:1px solid var(--border);white-space:nowrap}
th.num,td.num{text-align:right} th.ctr,td.ctr{text-align:center}
td{padding:12px 16px;border-bottom:1px solid var(--border);font-size:13.5px;vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr.clickable{cursor:pointer}
tbody tr.clickable:hover{background:var(--muted)}
tbody tr.row-selected{background:color-mix(in srgb, var(--brand-blue) 10%, transparent)}
tbody tr.row-dim{opacity:.3}
.cell-name{font-weight:600}
.cell-sub{font-size:11px;color:var(--muted-foreground)}
.mono{font-family:ui-monospace,"SF Mono",Consolas,monospace}
.clickable-text{cursor:pointer;font-weight:600}
.clickable-text:hover{color:var(--brand-blue)}
.clickable-text.is-active{color:var(--brand-blue)}

.badge{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.badge-green{background:color-mix(in srgb,var(--brand-green) 12%,transparent);color:var(--brand-green)}
.badge-amber{background:color-mix(in srgb,var(--brand-amber) 14%,transparent);color:var(--brand-amber)}
.badge-red{background:color-mix(in srgb,var(--brand-red) 12%,transparent);color:var(--brand-red)}
.badge-purple{background:color-mix(in srgb,var(--brand-purple) 12%,transparent);color:var(--brand-purple)}
.badge-blue{background:color-mix(in srgb,var(--brand-blue) 12%,transparent);color:var(--brand-blue)}

.text-green{color:var(--brand-green)} .text-amber{color:var(--brand-amber)} .text-red{color:var(--brand-red)}
.text-purple{color:var(--brand-purple)} .text-blue{color:var(--brand-blue)} .text-muted{color:var(--muted-foreground)}
.bg-green{background:var(--brand-green)} .bg-amber{background:var(--brand-amber)} .bg-red{background:var(--brand-red)} .bg-purple{background:var(--brand-purple)}

.score-chip{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;border-radius:6px;padding:0 4px;font-size:12.5px;font-weight:700}

/* ============================================================
   KPI TILES + mini visuals (kpi-tile.tsx / kpi-visuals.tsx)
   ============================================================ */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
@media(max-width:980px){.kpi-grid{grid-template-columns:repeat(2,1fr)}}
.kpi-tile{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;box-shadow:var(--shadow)}
.kpi-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.kpi-left{display:flex;align-items:flex-start;gap:10px;min-width:0}
.kpi-icon{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;flex-shrink:0;font-size:13px}
.kpi-label{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted-foreground)}
.kpi-value{font-size:23px;font-weight:700;letter-spacing:-.01em;margin-top:3px}
.kpi-sub{font-size:11.5px;color:var(--muted-foreground);margin-top:6px}
.kpi-footer{margin-top:10px}

.mini-stacked-bar{display:flex;height:8px;width:100%;overflow:hidden;border-radius:999px;background:var(--muted)}
.mini-stacked-bar span{height:100%}
.mini-status-bars{display:flex;align-items:flex-end;gap:4px;height:32px}
.mini-status-bars span{width:10px;border-radius:3px 3px 0 0}

/* ============================================================
   GAUGE / RADAR / DRIVERS (health-gauge / driver-radar-chart)
   ============================================================ */
.gauge-wrap{display:flex;flex-direction:column;align-items:center;text-align:center}
.gauge{position:relative;width:150px;height:150px}
.gauge-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.gauge-num{font-size:34px;font-weight:700;letter-spacing:-.01em}
.gauge-of{font-size:11px;color:var(--muted-foreground)}
.gauge-delta{margin-top:8px;font-size:12.5px;font-weight:600}
.gauge-lastq{margin-top:8px;font-size:12px;color:var(--muted-foreground)}

.driver-head{display:flex;align-items:center;gap:10px;padding-bottom:8px;font-size:10px;text-transform:uppercase;letter-spacing:.05em;font-weight:600;color:var(--muted-foreground)}
.driver-row{display:flex;align-items:center;gap:10px;padding:10px 8px;border-top:1px solid var(--border);margin:0 -8px;border-radius:8px;cursor:pointer}
.driver-row:first-child{border-top:none}
.driver-row:hover{background:var(--muted)}
.driver-row.selected{background:color-mix(in srgb,var(--brand-blue) 10%,transparent)}
.driver-name{flex:1;font-size:13.5px}
.driver-weight{margin-left:6px;border-radius:4px;background:var(--muted);padding:1px 6px;font-family:ui-monospace,Consolas,monospace;font-size:10px;color:var(--muted-foreground)}
.driver-info{margin-left:6px;color:var(--muted-foreground);cursor:help;font-size:11px;vertical-align:middle}
.driver-bar-track{width:70px;height:6px;border-radius:4px;background:var(--muted);overflow:hidden;flex-shrink:0}
.driver-bar-fill{display:block;height:100%}
.driver-score{width:32px;text-align:right;font-family:ui-monospace,Consolas,monospace;font-size:15px;font-weight:700}
.driver-delta{width:38px;text-align:right;font-family:ui-monospace,Consolas,monospace;font-size:12px}

/* ============================================================
   PAGE-LEVEL LAYOUT HELPERS
   ============================================================ */
.grid-2col{display:grid;grid-template-columns:290px 1fr;gap:18px;align-items:start}
@media(max-width:880px){.grid-2col{grid-template-columns:1fr}}
.client-header{display:flex;flex-wrap:wrap;align-items:center;gap:16px;padding:20px;margin-bottom:18px}
.avatar-box{display:grid;place-items:center;width:46px;height:46px;border-radius:11px;background:color-mix(in srgb,var(--brand-blue) 10%,transparent);color:var(--brand-blue);font-size:16px;font-weight:800;flex-shrink:0}
.client-facts{display:flex;flex-wrap:wrap;gap:22px;margin-left:auto;align-items:center}
.fact-label{font-size:10.5px;font-weight:600;letter-spacing:.06em;color:var(--muted-foreground);text-transform:uppercase}
.fact-value{font-size:15px;font-weight:600;margin-top:1px}
.breadcrumb{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;margin-bottom:14px}
.ai-summary{padding:16px;margin-bottom:18px}
.ai-summary .q{font-size:13px;color:var(--muted-foreground)}
.ai-summary .a{margin-top:8px;padding-top:10px;border-top:1px solid var(--border);font-size:13.5px}
.alerts-bell{display:inline-flex;align-items:center;gap:6px;border:1px solid color-mix(in srgb,var(--brand-red) 25%,transparent);background:color-mix(in srgb,var(--brand-red) 10%,transparent);color:var(--brand-red);border-radius:6px;padding:6px 10px;cursor:pointer;font-weight:700;font-size:13px}

.insights-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}
@media(max-width:880px){.insights-grid{grid-template-columns:1fr}}
.insight-card{padding:16px}
.insight-tag{font-family:ui-monospace,Consolas,monospace;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.insight-title{font-size:14.5px;font-weight:600;margin:8px 0 4px}
.insight-desc{font-size:12.5px;color:var(--muted-foreground);margin:0 0 8px}
.insight-action{font-size:12.5px;font-weight:600;color:var(--brand-blue);display:block}

.evidence-grid{display:grid;grid-template-columns:1fr 320px;gap:14px;margin-top:18px}
@media(max-width:880px){.evidence-grid{grid-template-columns:1fr}}
.evidence-item{display:flex;gap:10px;border-radius:8px;background:color-mix(in srgb,var(--muted) 60%,transparent);padding:10px;margin-bottom:8px}
.evidence-item .dot{flex-shrink:0}
.rec-card{border:1px dashed var(--border);padding:16px}
.rec-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btn{border-radius:8px;padding:8px 14px;font-size:12.5px;font-weight:600;cursor:pointer;border:1px solid var(--brand-blue);background:var(--brand-blue);color:#fff}
.btn:hover{opacity:.9}
.btn.outline{background:transparent;color:var(--foreground);border-color:var(--border)}
.btn.outline:hover{background:var(--muted)}

.risk-flags{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.risk-flag{display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:6px 12px;font-size:12.5px;font-weight:600}

.narrative-box{margin-top:18px;border-left:3px solid var(--brand-blue);background:color-mix(in srgb,var(--brand-blue) 10%,transparent);border-radius:0 12px 12px 0;padding:16px 20px}
.narrative-box .tag{font-family:ui-monospace,Consolas,monospace;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--brand-blue)}
.narrative-box p{margin:7px 0 0;font-size:14px}

.section-label{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-foreground);margin-bottom:10px}
.legend-row{display:flex;gap:16px;font-size:12px;color:var(--muted-foreground);flex-wrap:wrap}
.legend-dot{display:inline-block;width:9px;height:9px;border-radius:999px;margin-right:5px;vertical-align:middle}
.legend-item{cursor:pointer}
.legend-item.dim{opacity:.4}

.panel-row{border:1px solid var(--border);background:var(--card);border-radius:10px;padding:14px}
.panel-row .t{font-size:13.5px;font-weight:600}
.panel-row .d{margin-top:4px;font-size:12.5px;color:var(--muted-foreground)}

.value-report{max-width:780px;overflow:hidden;border-radius:16px;border:1px solid var(--border);background:var(--card);box-shadow:var(--shadow)}
.value-head{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);padding:26px}
.value-hero{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;background:color-mix(in srgb,var(--brand-blue) 10%,transparent);padding:26px}
.value-big{font-size:30px;font-weight:700;letter-spacing:-.02em}
.value-cap{font-size:12px;color:var(--muted-foreground);margin-top:2px}
.value-sec{padding:18px 26px;border-top:1px solid var(--border)}
.value-sec h4{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted-foreground)}
.value-sec ul{margin:0;padding-left:18px;font-size:14px}
.value-sec li{margin:5px 0}
.value-foot{padding:16px 26px;font-size:12px;color:var(--muted-foreground);border-top:1px solid var(--border)}

select.selbox, .toolbar-select{padding:8px 12px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--foreground);font-size:13px;font-weight:600;cursor:pointer;outline:none}
select.selbox:focus{border-color:var(--brand-blue)}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:16px}
.toolbar label{font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--muted-foreground);text-transform:uppercase}

/* ============================================================
   CHART CONTAINERS + tooltips
   ============================================================ */
.chart-box{width:100%}
.chart-box svg{display:block;width:100%;height:auto}
.chart-flex-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;flex-wrap:wrap;gap:6px}

/* ============================================================
   MODAL + TOAST
   ============================================================ */
.overlay{position:fixed;inset:0;background:rgba(10,13,10,.55);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px}
.modal{background:var(--card);border-radius:14px;border:1px solid var(--border);max-width:560px;width:100%;max-height:82vh;overflow-y:auto;padding:22px;box-shadow:var(--shadow)}
.modal-title{font-size:16px;font-weight:700;margin:0 0 4px}
.modal-desc{font-size:12.5px;color:var(--muted-foreground);margin:0}
.modal-close{position:absolute;top:14px;right:16px;cursor:pointer;color:var(--muted-foreground);font-size:16px;background:none;border:none}
.modal{position:relative}
.step-row{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:13.5px;color:var(--muted-foreground)}
.step-row.done{color:var(--foreground)}
.step-row.active{color:var(--foreground);font-weight:600}
.step-dot{display:grid;place-items:center;width:20px;height:20px;border-radius:999px;border:2px solid var(--border);font-size:11px;flex-shrink:0}
.step-dot.done{border-color:var(--brand-green);background:var(--brand-green);color:#fff}
.sim-result{margin-top:14px;border-radius:10px;background:color-mix(in srgb,var(--brand-green) 10%,transparent);padding:14px}
.sim-result .lbl{font-family:ui-monospace,Consolas,monospace;font-size:11px;color:var(--muted-foreground)}
.sim-result .val{margin-top:4px;font-family:ui-monospace,Consolas,monospace;font-size:13px;font-weight:600}
.sim-result .msg{margin-top:10px;border-radius:8px;background:color-mix(in srgb,var(--muted) 70%,transparent);padding:10px;font-size:12px}

#toast-root{position:fixed;bottom:20px;right:20px;z-index:300;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--foreground);color:var(--background);padding:10px 16px;border-radius:8px;font-size:12.5px;font-weight:600;box-shadow:var(--shadow);opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translateY(0)}

.skeleton{background:var(--muted);border-radius:8px;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}

@media print{ .sidebar,.topbar{display:none} }
</style>
</head>
<body>
<div id="app">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="sidebar-logo-inner" onclick="navigate('')">
        <span class="sidebar-logo-mark">
          <svg viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg">
            <circle cx="160" cy="160" r="110" fill="none" stroke="#32DB86" stroke-width="4"/>
            <circle cx="160" cy="160" r="80" fill="none" stroke="#32DB86" stroke-width="1.5" stroke-dasharray="4 5" opacity="0.5"/>
            <g fill="#32DB86">
              <rect x="130" y="190" width="14" height="30" rx="2"/>
              <rect x="153" y="170" width="14" height="50" rx="2"/>
              <rect x="176" y="145" width="14" height="75" rx="2"/>
            </g>
            <circle cx="210" cy="120" r="7" fill="#32DB86"/>
          </svg>
        </span>
        <span class="sidebar-logo-text">
          <div class="sidebar-logo-title">Recon <span>360</span></div>
          <div class="sidebar-logo-sub">By LiveRamp</div>
        </span>
      </div>
    </div>
    <nav class="sidebar-nav" id="sidebar-nav"></nav>
    <div class="sidebar-footer">
      <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme" onclick="toggleTheme()">
        <span class="knob" id="theme-knob">☀</span>
      </button>
      <div class="user-chip">
        <span class="user-avatar">DR</span>
        <div>
          <div class="user-name">Dana Ruiz</div>
          <div class="user-role">CS Ops</div>
        </div>
      </div>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <span class="topbar-title" id="topbar-title">Client Radar</span>
      <div class="topbar-right">

/* ============================================================
   NAV + ROUTER
   ============================================================ */
const TABS = [
  { href: '', label: 'Client Radar', icon: '▦' },
  { href: 'upsell', label: 'Upsell Engine', icon: '↗' },
  { href: 'margin', label: 'Margin', icon: '%' },
  { href: 'alerts', label: 'Alerts', icon: '🔔' },
  { href: 'value', label: 'Value Report', icon: '📄' },
  { href: 'migration', label: 'Migration Insight', icon: '⇄' },
];

function navigate(path) { location.hash = '#/' + path; }

function currentRoute() {
  return location.hash.replace(/^#\/?/, '');
}

function titleForRoute(hash) {
  const exact = TABS.find((t) => t.href === hash);
  if (exact) return exact.label;
  if (hash.startsWith('clients/')) return 'Client Radar';
  return 'Recon 360';
}

function renderNav() {
  const hash = currentRoute();
  const el = document.getElementById('sidebar-nav');
  el.innerHTML = TABS.map((t) => {
    const active = hash === t.href || (t.href !== '' && hash.startsWith(t.href));
    return `<a class="${active ? 'active' : ''}" onclick="navigate('${t.href}')"><span class="nicon">${t.icon}</span>${t.label}</a>`;
  }).join('');
}

function handleTopbarSearch(e) {
  if (e.key !== 'Enter') return;
  const q = e.target.value.trim().toLowerCase();
  if (!q) return;
  const match = DATA.portfolio.clients.find((c) => c.name.toLowerCase().includes(q) || c.id.toLowerCase().includes(q));
  if (match) { navigate('clients/' + match.id); e.target.value = ''; }
  else showToast('No client matched "' + e.target.value + '"');
}

function render() {
  const hash = currentRoute();
  renderNav();
  document.getElementById('topbar-title').textContent = titleForRoute(hash);
  const main = document.getElementById('main-content');
  if (hash === '') main.innerHTML = renderPortfolioPage();
  else if (hash === 'upsell') main.innerHTML = renderUpsellPage();
  else if (hash === 'margin') main.innerHTML = renderMarginPage();
  else if (hash === 'alerts') main.innerHTML = renderAlertsPage();
  else if (hash === 'value') main.innerHTML = renderValuePage();
  else if (hash === 'migration') main.innerHTML = renderMigrationPage();
  else if (hash.startsWith('clients/')) main.innerHTML = renderClientDetailPage(hash.split('/')[1]);
  else main.innerHTML = renderPortfolioPage();
  window.scrollTo(0, 0);
  afterRenderHook();
}

let afterRenderHook = function(){};

window.addEventListener('hashchange', render);
window.addEventListener('DOMContentLoaded', () => { initTheme(); render(); });

/* ============================================================
   THEME
   ============================================================ */
function initTheme() {
  const dark = document.documentElement.classList.contains('dark');
  document.getElementById('theme-toggle').classList.toggle('is-dark', dark);
  document.getElementById('theme-knob').textContent = dark ? '☾' : '☀';
}
function toggleTheme() {
  const dark = !document.documentElement.classList.contains('dark');
  document.documentElement.classList.toggle('dark', dark);
  try { localStorage.setItem('recon360-theme', dark ? 'dark' : 'light'); } catch (e) {}
  initTheme();
}

/* ============================================================
   TOAST + MODAL
   ============================================================ */
function showToast(msg) {
  const root = document.getElementById('toast-root');
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  root.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 250); }, 2800);
}

function openModal(innerHtml) {
  const root = document.getElementById('modal-root');
  root.innerHTML = `<div class="overlay" onclick="if(event.target===this) closeModal()">
    <div class="modal">
      <button class="modal-close" onclick="closeModal()">✕</button>
      ${innerHtml}
    </div>
  </div>`;
}
function closeModal() { document.getElementById('modal-root').innerHTML = ''; }

  proposal_submitted: { label: 'Proposal Submitted', cls: 'badge-amber' },
  deferred: { label: 'Deferred', cls: 'badge-red' },
  signed: { label: 'Signed / Closed Won', cls: 'badge-green' },
};
function migrationStageBadge(stage) { return MIGRATION_STAGE_META[stage] || { label: stage, cls: 'badge-amber' }; }

function insightTagClass(tag) { return tag === 'risk' ? 'text-red' : tag === 'grow' ? 'text-green' : 'text-purple'; }

/* Deterministic categorical color per product — mirrors lib/product-colors.ts */
const PRODUCT_PALETTE = ['var(--brand-green)', 'var(--brand-blue)', 'var(--brand-amber)', 'var(--brand-purple)', 'var(--brand-red)'];
function stringHash(id) { let h = 0; for (const ch of String(id)) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return h; }
function productColor(id) { return PRODUCT_PALETTE[stringHash(id) % PRODUCT_PALETTE.length]; }

function fmtCompactMoney(v) {
  if (!v) return '$0';
  if (v >= 1000000) return '$' + (v / 1000000).toFixed(1) + 'M';
  if (v >= 1000) return '$' + (v / 1000).toFixed(1) + 'K';
  return '$' + Math.round(v);
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }

/* ============================================================
   SHARED SMALL COMPONENTS
   ============================================================ */
function scoreChipHtml(score) {
  const color = scoreToColor(score);
  return `<span class="score-chip badge-${color}">${score}</span>`;
}
function kpiTileHtml({ label, value, sub, valueClass, iconGlyph, iconColorVar, visualHtml, footerHtml }) {
  return `<div class="kpi-tile">
    <div class="kpi-top">
      <div class="kpi-left">
        ${iconGlyph ? `<span class="kpi-icon" style="background:color-mix(in srgb, ${iconColorVar} 14%, transparent); color:${iconColorVar}">${iconGlyph}</span>` : ''}
        <div>
          <div class="kpi-label">${esc(label)}</div>
          <div class="kpi-value ${valueClass || ''}">${esc(value)}</div>
        </div>
      </div>
      ${visualHtml || ''}
    </div>
    ${sub ? `<div class="kpi-sub">${esc(sub)}</div>` : ''}
    ${footerHtml ? `<div class="kpi-footer">${footerHtml}</div>` : ''}
  </div>`;
}
function miniStackedBarHtml(segments) {
  const total = segments.reduce((t, s) => t + s.value, 0) || 1;
  const title = segments.map((s) => `${s.label}: ${Math.round((s.value / total) * 100)}%`).join(' · ');
  return `<div class="mini-stacked-bar" title="${esc(title)}">${segments.map((s) => `<span style="width:${(s.value / total) * 100}%;background:${s.color}"></span>`).join('')}</div>`;
}
function miniStatusBarsHtml(segments) {
  const max = Math.max.apply(null, segments.map((s) => s.value).concat([1]));
  const title = segments.map((s) => `${s.label}: ${s.value}`).join(' · ');
  return `<div class="mini-status-bars" title="${esc(title)}">${segments.map((s) => `<span style="height:${Math.max((s.value / max) * 100, 10)}%;background:${s.color}"></span>`).join('')}</div>`;
}
function miniMeterSvg(pct, color, size) {
  size = size || 40;
  const r = size * 0.42, cx = size / 2, cy = size / 2, circ = 2 * Math.PI * r;
  const dash = circ * Math.min(pct, 100) / 100;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--muted)" stroke-width="${size * 0.16}"/>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="${size * 0.16}" stroke-linecap="round" stroke-dasharray="${dash} ${circ - dash}" transform="rotate(-90 ${cx} ${cy})"/>
  </svg>`;
}

/* ============================================================
   CHART BUILDERS (plain inline SVG — no chart libraries)

function healthGaugeSvg(score) {
  const color = 'var(--brand-' + scoreToColor(score) + ')';
  const r = 65, cx = 75, cy = 75, circ = 2 * Math.PI * r;
  const dash = circ * Math.min(Math.max(score, 0), 100) / 100;
  return `<div class="gauge">
    <svg width="150" height="150" viewBox="0 0 150 150">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--muted)" stroke-width="13"/>
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="13" stroke-linecap="round"
        stroke-dasharray="${dash} ${circ - dash}" transform="rotate(-90 ${cx} ${cy})"/>
    </svg>
    <div class="gauge-center"><span class="gauge-num">${score}</span><span class="gauge-of">/ 100</span></div>
  </div>`;
}

const DRIVER_SHORT_NAME = { Utilization: 'Util.', 'Value Delivered': 'Value Delivered', 'Timely Payments': 'Timely Payments', Products: 'Products', Relationship: 'Rel.' };

function driverRadarSvg(drivers) {
  const n = drivers.length, cx = 130, cy = 100, maxR = 68;
  function pt(i, r) { const a = -Math.PI / 2 + i * (2 * Math.PI / n); return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; }
  const rings = [0.34, 0.67, 1].map((f) => `<polygon points="${drivers.map((_, i) => pt(i, maxR * f).join(',')).join(' ')}" fill="none" stroke="var(--border)"/>`).join('');
  const axes = drivers.map((d, i) => { const [x, y] = pt(i, maxR); return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--border)"/>`; }).join('');
  const dataPts = drivers.map((d, i) => pt(i, maxR * (Math.max(d.value, 0) / 100)).join(',')).join(' ');
  const dots = drivers.map((d, i) => { const [x, y] = pt(i, maxR * (Math.max(d.value, 0) / 100)); return `<circle cx="${x}" cy="${y}" r="3.5" fill="var(--brand-blue)"><title>${esc(d.name)}: ${d.value}</title></circle>`; }).join('');
  const labels = drivers.map((d, i) => {
    const [x, y] = pt(i, maxR + 22);
    return `<text x="${x}" y="${y}" font-size="10.5" fill="var(--muted-foreground)" text-anchor="middle" dominant-baseline="middle">${esc(DRIVER_SHORT_NAME[d.name] || d.name)}</text>`;
  }).join('');
  return `<div class="chart-box"><svg viewBox="0 0 260 200" width="100%" height="190">
    ${rings}${axes}
    <polygon points="${dataPts}" fill="var(--brand-blue)" fill-opacity="0.15" stroke="var(--brand-blue)" stroke-width="2"/>
    ${dots}${labels}
  </svg></div>`;
}

function miniTrendSvg(series, color) {
  const vals = series.map((s) => s.value);
  const min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
  const w = 96, h = 28, pad = 3;
  const pts = series.map((s, i) => {
    const x = pad + (i / (series.length - 1 || 1)) * (w - pad * 2);
    const y = max === min ? h / 2 : h - pad - ((s.value - min) / (max - min)) * (h - pad * 2);
    return x.toFixed(1) + ',' + y.toFixed(1);
  }).join(' ');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

function pivotProductTrend(products) {
  if (!products.length) return [];
  return products[0].series.map((point, i) => {
    const row = { month: point.month };
    products.forEach((p) => {
      const base = p.series[0].value;
      row[p.productId] = base ? Math.round((p.series[i].value / base) * 100) : 0;
    });
    return row;
  });
}

function productTrendChartSvg(products, active) {
  if (!products.length) return '<p class="text-muted" style="font-size:12.5px">No trend data.</p>';
  const data = pivotProductTrend(products);
  const w = 720, h = 250, padL = 40, padR = 12, padT = 10, padB = 26;
  const plotW = w - padL - padR, plotH = h - padT - padB;
  const n = data.length;
  const allVals = data.flatMap((row) => products.map((p) => row[p.productId]));
  const yMax = Math.max(100, ...allVals) * 1.1;
  const yMin = Math.min(0, Math.min(100, ...allVals));
  function x(i) { return padL + (n <= 1 ? 0 : (i / (n - 1)) * plotW); }
  function y(v) { return padT + plotH - ((v - yMin) / (yMax - yMin || 1)) * plotH; }

  const gridY = [0, 0.25, 0.5, 0.75, 1].map((f) => {
    const yv = yMin + f * (yMax - yMin);
    return `<line x1="${padL}" y1="${y(yv).toFixed(1)}" x2="${w - padR}" y2="${y(yv).toFixed(1)}" stroke="var(--border)"/>
      <text x="${padL - 6}" y="${y(yv).toFixed(1)}" font-size="11" fill="var(--muted-foreground)" text-anchor="end" dominant-baseline="middle">${Math.round(yv)}%</text>`;
  }).join('');
  const xLabels = data.map((row, i) => `<text x="${x(i).toFixed(1)}" y="${h - 6}" font-size="12" fill="var(--muted-foreground)" text-anchor="middle">${esc(row.month)}</text>`).join('');
  const refLine = `<line x1="${padL}" y1="${y(100).toFixed(1)}" x2="${w - padR}" y2="${y(100).toFixed(1)}" stroke="var(--muted-foreground)" stroke-dasharray="3 3"/>`;

  const ordered = active ? products.filter((p) => p.productId !== active).concat(products.filter((p) => p.productId === active)) : products;
  const defs = products.map((p) => `<linearGradient id="grad-${p.productId}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${productColor(p.productId)}" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="${productColor(p.productId)}" stop-opacity="0"/>
    </linearGradient>`).join('');

  const areas = ordered.map((p) => {
    const dim = active !== null && active !== undefined && active !== p.productId;
    const color = dim ? 'var(--muted-foreground)' : productColor(p.productId);
    const pathPts = data.map((row, i) => x(i).toFixed(1) + ',' + y(row[p.productId]).toFixed(1));
    const line = 'M' + pathPts.join(' L');
    const area = line + ` L${x(n - 1).toFixed(1)},${y(yMin).toFixed(1)} L${x(0).toFixed(1)},${y(yMin).toFixed(1)} Z`;
    const dots = data.map((row, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(row[p.productId]).toFixed(1)}" r="${dim ? 0 : 3.5}" fill="${color}"><title>${esc(p.name)} · ${esc(row.month)}: ${row[p.productId]}% of first month</title></circle>`).join('');
    return `<path d="${area}" fill="${dim ? 'var(--muted-foreground)' : 'url(#grad-' + p.productId + ')'}" fill-opacity="${dim ? 0.06 : 1}"/>
      <path d="${line}" fill="none" stroke="${color}" stroke-width="${dim ? 1.5 : 2.5}" stroke-opacity="${dim ? 0.4 : 1}"/>
      ${dots}`;
  }).join('');

  const legend = products.map((p) => {
    const dim = active !== null && active !== undefined && active !== p.productId;
    return `<span class="legend-item ${dim ? 'dim' : ''}" onclick="onProductLegendClick('${p.productId}')"><span class="legend-dot" style="background:${productColor(p.productId)}"></span>${esc(p.name)}</span>`;
  }).join('');

  return `<div class="chart-box"><svg viewBox="0 0 ${w} ${h}" width="100%" height="250">
    <defs>${defs}</defs>
    ${gridY}${refLine}${areas}${xLabels}
  </svg></div>
  <div class="legend-row" style="margin-top:8px">${legend}</div>`;
}

function marginBubbleChartSvg(rows) {
  const w = 720, h = 340, padL = 46, padR = 16, padT = 14, padB = 40;
  const plotW = w - padL - padR, plotH = h - padT - padB;
  const xDom = [30, 100], yDom = [0, 70];
  function x(v) { return padL + ((v - xDom[0]) / (xDom[1] - xDom[0])) * plotW; }
  function y(v) { return padT + plotH - ((v - yDom[0]) / (yDom[1] - yDom[0])) * plotH; }
  const maxAcv = Math.max.apply(null, rows.map((r) => r.acv).concat([1]));
  function radius(acv) { return 6 + Math.sqrt(acv / maxAcv) * 22; }
  const FLAG_COLOR = { ok: 'var(--brand-green)', watch: 'var(--brand-amber)', low: 'var(--brand-red)', hidden: 'var(--brand-purple)' };

  const gridX = [30, 45, 60, 75, 90, 100].map((v) => `<line x1="${x(v).toFixed(1)}" y1="${padT}" x2="${x(v).toFixed(1)}" y2="${h - padB}" stroke="var(--border)"/>
    <text x="${x(v).toFixed(1)}" y="${h - padB + 16}" font-size="11" fill="var(--muted-foreground)" text-anchor="middle">${v}</text>`).join('');
  const gridY = [0, 10, 20, 30, 40, 50, 60, 70].map((v) => `<line x1="${padL}" y1="${y(v).toFixed(1)}" x2="${w - padR}" y2="${y(v).toFixed(1)}" stroke="var(--border)"/>
    <text x="${padL - 8}" y="${y(v).toFixed(1)}" font-size="11" fill="var(--muted-foreground)" text-anchor="end" dominant-baseline="middle">${v}%</text>`).join('');
  const refLine = `<line x1="${padL}" y1="${y(50).toFixed(1)}" x2="${w - padR}" y2="${y(50).toFixed(1)}" stroke="var(--muted-foreground)" stroke-dasharray="4 4"/>`;

  const bubbles = rows.map((r) => {
    const badge = marginFlagBadge(r.flag);
    return `<circle cx="${x(r.healthScore).toFixed(1)}" cy="${y(r.marginPct).toFixed(1)}" r="${radius(r.acv).toFixed(1)}" fill="${FLAG_COLOR[r.flag]}" fill-opacity="0.72" stroke="${FLAG_COLOR[r.flag]}" stroke-width="1">
      <title>${esc(r.clientName)} — ACV ${esc(r.acvLabel)} · Margin ${r.marginPct.toFixed(0)}% · Health ${r.healthScore} · ${esc(badge.label)}</title>
    </circle>`;
  }).join('');

  const flagsPresent = Array.from(new Set(rows.map((r) => r.flag)));
  const legend = flagsPresent.map((f) => `<span class="legend-item"><span class="legend-dot" style="background:${FLAG_COLOR[f]}"></span>${esc(marginFlagBadge(f).label)}</span>`).join('');

  return `<div class="chart-box"><svg viewBox="0 0 ${w} ${h}" width="100%" height="340">
    ${gridX}${gridY}${refLine}${bubbles}
    <text x="${w - padR}" y="${h - 6}" font-size="11" fill="var(--muted-foreground)" text-anchor="end">Health score →</text>
    <text x="${padL}" y="${padT - 2}" font-size="11" fill="var(--muted-foreground)" text-anchor="start">Margin % ↑</text>
  </svg></div>
  <div class="legend-row" style="margin-top:8px">${legend}</div>`;
}

function upsellBarChartSvg(plays) {
  const byClient = new Map();
  plays.forEach((p) => {
    const row = byClient.get(p.clientId) || { clientId: p.clientId, clientName: p.clientName, over_usage: 0, whitespace: 0 };
    row[p.signal] = (row[p.signal] || 0) + p.upliftAcv;
    byClient.set(p.clientId, row);
  });
  const data = Array.from(byClient.values()).sort((a, b) => (b.over_usage + b.whitespace) - (a.over_usage + a.whitespace)).slice(0, 8);
  if (!data.length) return '<p class="text-muted" style="font-size:12.5px">No upsell plays.</p>';

  const w = 720, h = 300, padL = 50, padR = 12, padT = 10, padB = 70;
  const plotW = w - padL - padR, plotH = h - padT - padB;
  const maxV = Math.max.apply(null, data.flatMap((d) => [d.over_usage, d.whitespace]).concat([1])) * 1.15;
  function y(v) { return padT + plotH - (v / maxV) * plotH; }
  const groupW = plotW / data.length;
  const barW = Math.min(30, groupW * 0.32);

  const gridY = [0, 0.25, 0.5, 0.75, 1].map((f) => `<line x1="${padL}" y1="${(padT + plotH * (1 - f)).toFixed(1)}" x2="${w - padR}" y2="${(padT + plotH * (1 - f)).toFixed(1)}" stroke="var(--border)"/>
    <text x="${padL - 8}" y="${(padT + plotH * (1 - f)).toFixed(1)}" font-size="11" fill="var(--muted-foreground)" text-anchor="end" dominant-baseline="middle">${fmtCompactMoney(maxV * f)}</text>`).join('');

  const bars = data.map((d, i) => {
    const cx = padL + groupW * (i + 0.5);
    const x1 = cx - barW - 2, x2 = cx + 2;
    const b1 = d.over_usage > 0 ? `<rect x="${x1.toFixed(1)}" y="${y(d.over_usage).toFixed(1)}" width="${barW.toFixed(1)}" height="${(plotH - (y(d.over_usage) - padT)).toFixed(1)}" rx="4" fill="var(--brand-red)"><title>${esc(d.clientName)} · Over-usage: ${fmtCompactMoney(d.over_usage)}</title></rect>` : '';
    const b2 = d.whitespace > 0 ? `<rect x="${x2.toFixed(1)}" y="${y(d.whitespace).toFixed(1)}" width="${barW.toFixed(1)}" height="${(plotH - (y(d.whitespace) - padT)).toFixed(1)}" rx="4" fill="var(--brand-purple)"><title>${esc(d.clientName)} · Whitespace: ${fmtCompactMoney(d.whitespace)}</title></rect>` : '';
    const label = `<text x="${cx.toFixed(1)}" y="${h - padB + 14}" font-size="12" fill="var(--muted-foreground)" text-anchor="end" transform="rotate(-28 ${cx.toFixed(1)} ${(h - padB + 14).toFixed(1)})">${esc(d.clientName)}</text>`;
    return b1 + b2 + label;
  }).join('');

  return `<div class="chart-box"><svg viewBox="0 0 ${w} ${h}" width="100%" height="300">${gridY}${bars}</svg></div>`;
}

function usageTrendBarChartSvg(data) {
  const w = 640, h = 230, padL = 6, padR = 6, padT = 10, padB = 26;
  const plotW = w - padL - padR, plotH = h - padT - padB;
  const max = Math.max.apply(null, data.map((d) => d.value).concat([1]));
  const groupW = plotW / data.length;
  const barW = Math.min(40, groupW * 0.6);
  function barColor(v) {
    const pct = (v / max) * 100;
    if (pct >= 95) return 'var(--brand-blue)';
    if (pct >= 80) return 'var(--brand-green)';
    if (pct >= 65) return 'var(--brand-amber)';
    return 'var(--brand-red)';
  }
  const bars = data.map((d, i) => {
    const cx = padL + groupW * (i + 0.5);
    const barH = (d.value / max) * plotH;
    const yTop = padT + plotH - barH;
    return `<rect x="${(cx - barW / 2).toFixed(1)}" y="${yTop.toFixed(1)}" width="${barW.toFixed(1)}" height="${barH.toFixed(1)}" rx="6" fill="${barColor(d.value)}"><title>${esc(d.month)}: ${d.value}</title></rect>
      <text x="${cx.toFixed(1)}" y="${h - padB + 16}" font-size="11" fill="var(--muted-foreground)" text-anchor="middle">${esc(d.month.slice(5))}</text>`;
  }).join('');
  return `<div class="chart-box"><svg viewBox="0 0 ${w} ${h}" width="100%" height="230">${bars}</svg></div>`;
}

function statusColorVar(status) {
  return status === 'healthy' ? 'var(--brand-green)' : status === 'critical' ? 'var(--brand-red)' : 'var(--brand-amber)';
}
function statusLabel(status) {
  return status === 'healthy' ? 'Healthy' : status === 'watch' ? 'Watch' : status === 'at_risk' ? 'At Risk' : 'Critical';
}
function byStatus(clients, pick) {
  return ['healthy', 'watch', 'at_risk', 'critical'].map((status) => ({
    value: clients.filter((c) => c.status === status).reduce((t, c) => t + pick(c), 0),
    color: statusColorVar(status),
    label: statusLabel(status),
  }));
}

const SIM_STEPS = {
  salesforce: ['Validating request', 'Applying policy + permissions', 'Sending to Workato', 'Creating Salesforce task', 'Posting Slack confirmation'],
  slack: ['Validating request', 'Applying policy + permissions', 'Sending to Workato', 'Posting to #account-team-alerts'],
};
function runSimulatedAction(type, clientName, owner, recText) {
  const steps = SIM_STEPS[type];
  let i = 0;
  function draw() {
    const stepsHtml = steps.map((s, idx) => `<div class="step-row ${idx < i ? 'done' : idx === i ? 'active' : ''}">
        <span class="step-dot ${idx < i ? 'done' : ''}">${idx < i ? '✓' : idx + 1}</span>${esc(s)}
      </div>`).join('');
    const done = i >= steps.length;
    openModal(`<div class="modal-title">${type === 'salesforce' ? 'Creating Salesforce follow-up' : 'Sending Slack alert'}</div>
      <p class="modal-desc">Client: ${esc(clientName)} · Owner: ${esc(owner)}</p>
      <div style="margin-top:14px">${stepsHtml}</div>
      ${done ? `<div class="sim-result">
          <div class="lbl">SIMULATED — NO REAL SYSTEM WAS CONTACTED</div>
          <div class="val">${type === 'salesforce' ? 'Salesforce task would be created' : 'Slack alert would be posted to #account-team-alerts'}</div>
          <div class="msg">${esc(recText)}</div>
        </div>
        <div style="margin-top:14px;display:flex;justify-content:flex-end"><button class="btn" onclick="closeModal()">Close</button></div>` : ''}
    `);
  }
  draw();
  const timer = setInterval(() => {
    i++;
    draw();
    if (i >= steps.length) clearInterval(timer);
  }, 450);
}

      <div class="card-header"><span class="card-header-title">Active alerts</span></div>
      <div class="table-wrap"><table>
        <thead><tr><th>Severity</th><th>Client / Product</th><th>What happened</th><th>Signal</th><th>Detected</th><th>Owner</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
      <p class="card-footnote">Derived from daily usage movement · illustrative timestamps</p>
    </div>`;
}

/* ============================================================
   PAGE: VALUE REPORT — apps/web/src/app/value/page.tsx
   ============================================================ */
let valueSelectedClient = null;

function clientSelectOptions(selected, clients) {
  const list = (clients || DATA.portfolio.clients).slice().sort((a, b) => a.name.localeCompare(b.name));
  return list.map((c) => `<option value="${c.id}" ${c.id === selected ? 'selected' : ''}>${esc(c.name)}</option>`).join('');
}

function renderValuePage() {
  if (!valueSelectedClient) valueSelectedClient = DATA.portfolio.clients[0].id;
  const data = DATA.valueReports[valueSelectedClient];

  const usedItems = (data.usedItems || []).map((it) => `<li><b>${esc(it.name)}</b> — ${esc(it.usage)}</li>`).join('');

  return `
    <h1 class="page-title">Client Value Report</h1>
    <p class="page-sub">One-click, client-ready value summary generated from live usage — for QBRs and renewals.</p>
    <div class="toolbar">
      <label>Client</label>
      <select class="selbox" onchange="valueSelectedClient=this.value; document.getElementById('main-content').innerHTML=renderValuePage()">
        ${clientSelectOptions(valueSelectedClient)}
      </select>
      <button class="btn outline" style="margin-left:auto" onclick="window.print()">🖶 Export as PDF</button>
    </div>
    <div class="value-report">
      <div class="value-head">
        <div>
          <div style="font-size:19px;font-weight:700">Your LiveRamp Value Summary</div>
          <div class="value-cap" style="margin-top:2px">Prepared for ${esc(data.clientName)} · Q3 FY26</div>
        </div>
        <div style="font-size:16px;font-weight:800;color:var(--brand-blue)">LiveRamp</div>
      </div>
      <div class="value-hero">
        <div><div class="value-big">${data.roiMultiplier}x</div><div class="value-cap">Return on investment</div></div>
        <div><div class="value-big">${data.productsUsed}/${data.productsOwned}</div><div class="value-cap">Products actively adopted</div></div>
        <div><div class="value-big">${esc(data.tenure)}</div><div class="value-cap">Partnership tenure</div></div>
      </div>
      <div class="value-sec">
        <h4>Value delivered this quarter</h4>
        <ul>${usedItems || '<li>No usage recorded this period.</li>'}</ul>
      </div>
      <div class="value-sec">
        <h4>Outcomes</h4>
        <ul>
          <li>Consistent identity resolution and activation across your key destinations</li>
          <li>Measured ROI of ${data.roiMultiplier}x against your annual investment</li>
          <li>Dedicated support with ${data.stakeholders} active stakeholders engaged</li>
        </ul>
      </div>
      <div class="value-foot">Generated from your live usage through the current period. Share with your LiveRamp team for a deeper review.</div>
    </div>`;
}

/* ============================================================
   PAGE: MIGRATION — apps/web/src/app/migration/page.tsx
   ============================================================ */
let migrationSelectedClient = null;

function onMigrationClientChange(id) {
  migrationSelectedClient = id;
  document.getElementById('main-content').innerHTML = renderMigrationPage();
}

function renderMigrationPage() {
  const overview = DATA.migrationOverview;
  const queue = DATA.migrationQueue;
  if (!migrationSelectedClient && queue.length) migrationSelectedClient = queue[0].clientId;
  const account = DATA.migrationAccounts[migrationSelectedClient];

  const kpis = kpiTileHtml({ label: 'Total Portfolio ACV', value: overview.kpis.totalPortfolioAcvLabel, sub: 'across the full portfolio' })
    + kpiTileHtml({ label: 'At-Risk ACV', value: overview.kpis.atRiskAcvLabel, sub: `${overview.kpis.atRiskAccountCount} accounts need review`, valueClass: 'text-red' })
    + kpiTileHtml({ label: 'Migration Required', value: overview.kpis.migrationRequiredCount, sub: 'Accounts in scope for token pricing', valueClass: 'text-amber' })
    + kpiTileHtml({ label: 'Avg Margin', value: overview.kpis.avgMarginPct + '%', sub: 'under default cost-to-serve assumptions' });

  const alertsHtml = overview.alerts.map((a) => {
    const badge = migrationSeverityBadge(a.severity);
    return `<li style="display:flex;align-items:center;gap:10px;font-size:13.5px;margin-bottom:8px"><span class="badge ${badge.cls}">${badge.label}</span>${esc(a.message)}</li>`;
  }).join('');

  const queueRows = queue.map((row) => {
    const stage = migrationStageBadge(row.stage);
    return `<tr class="clickable ${row.clientId === migrationSelectedClient ? 'row-selected' : ''}" onclick="onMigrationClientChange('${row.clientId}')">
      <td class="cell-name">${esc(row.clientName)}</td>
      <td><span class="badge badge-amber">Required</span></td>
      <td><span class="badge ${stage.cls}">${stage.label}</span></td>
      <td class="text-muted">${esc(row.recommendedAction)}</td>
      <td class="num">${esc(row.acv)}</td>
      <td class="text-muted">${esc(row.owner)}</td>
    </tr>`;
  }).join('');

  const accountCard = account ? `<div class="card card-pad">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <div style="font-weight:600">${esc(account.clientName)}</div>
        <span class="badge ${healthBadge(account.healthStatus).cls}">${healthBadge(account.healthStatus).label}</span>
      </div>
      <p class="text-muted" style="margin-top:6px;font-size:12.5px">${esc(account.narrative)}</p>
      <div style="margin-top:14px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px">
        <div><div class="fact-label">ACV</div><div class="fact-value">${esc(account.acv)}</div></div>
        <div><div class="fact-label">Usage Trend</div><div class="fact-value ${account.usageTrendPct < 0 ? 'text-red' : 'text-green'}">${account.usageTrendPct > 0 ? '+' : ''}${account.usageTrendPct}%</div></div>
        <div><div class="fact-label">Current Margin</div><div class="fact-value">${account.currentMarginPct}%</div></div>
        <div><div class="fact-label">Renewal</div><div class="fact-value ${urgencyClass(account.renewalUrgency)}">${esc(account.renewal)}</div></div>
      </div>
    </div>` : '<div class="skeleton" style="height:160px"></div>';

  const panel = account ? `<div style="display:grid;gap:10px">
      <div class="panel-row"><div class="t">Migration Req: ${account.migrationRequired ? 'Required' : 'Not Required'}</div><div class="d">${account.migrationRequired ? 'This account is in scope and should be moved to token pricing.' : "This account doesn't currently meet the migration criteria."}</div></div>
      <div class="panel-row"><div class="t">Suggested Token Plan</div><div class="d">${esc(account.tokenPlan.ratePerTokenLabel)} · ${account.tokenPlan.bundles} bundle${account.tokenPlan.bundles !== 1 ? 's' : ''}${account.tokenPlan.estimatedAcvImpactLabel ? ' · Estimated ACV impact: +' + esc(account.tokenPlan.estimatedAcvImpactLabel) : ''}</div></div>
      <div class="panel-row"><div class="t">What to Show the Client</div><div class="d">${esc(account.whatToShowClient.join(', '))}</div></div>
      <div class="panel-row"><div class="t">Escalation Path</div><div class="d">${esc(account.escalationPath)}</div></div>
      <div class="panel-row"><div class="t">Migration Stage</div><div class="d"><span class="badge ${migrationStageBadge(account.stage).cls}">${migrationStageBadge(account.stage).label}</span></div></div>
    </div>` : '';

  return `
    <h1 class="page-title">Token Migration</h1>
    <p class="page-sub">Portfolio health, usage, margin, and token-pricing migration in one view — derived from the same client data as the rest of the portfolio.</p>
    <div class="kpi-grid">${kpis}</div>
    <div style="display:grid;grid-template-columns:1.2fr 1fr;gap:18px;margin-bottom:18px" class="responsive-2col">
      <div class="card card-pad">
        <div class="chart-flex-header"><div class="section-label" style="margin-bottom:0">Usage Trends</div><span class="text-muted" style="font-size:12px">Portfolio usage index by month</span></div>
        ${usageTrendBarChartSvg(overview.usageTrend)}
        <p class="text-muted" style="font-size:11.5px;margin-top:8px">Indexed to the latest month (Aug = 100) · aggregated from every client/product's usage curve.</p>
      </div>
      <div class="card card-pad">
        <div class="chart-flex-header"><div class="section-label" style="margin-bottom:0">Portfolio Alerts</div><span class="text-muted" style="font-size:12px">Action-oriented</span></div>
        <ul style="list-style:none;padding:0;margin:0">${alertsHtml}</ul>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:1.1fr 0.9fr;gap:18px;margin-bottom:18px" class="responsive-2col">
      <div class="card card-pad">
        <div class="chart-flex-header">
          <div class="section-label" style="margin-bottom:0">Account Drill-down</div>
          <select class="selbox" onchange="onMigrationClientChange(this.value)">${clientSelectOptions(migrationSelectedClient, queue.map((q) => ({ id: q.clientId, name: q.clientName })))}</select>
        </div>
        ${accountCard}
      </div>
      <div class="card card-pad">
        <div class="section-label">Migration Panel</div>
        ${panel}
      </div>
    </div>
    <div class="card" style="overflow:hidden">
      <div class="card-header"><span class="card-header-title">Migration Queue</span><span class="text-muted" style="font-size:13px">${queue.length} accounts in scope</span></div>
      <div class="table-wrap"><table>
        <thead><tr><th>Account</th><th>Migration Req</th><th>Stage</th><th>Recommended Action</th><th class="num">ACV</th><th>Owner</th></tr></thead>
        <tbody>${queueRows}</tbody>
      </table></div>
      <p class="card-footnote">Examples across the portfolio · migration status derived from usage, over-usage, and margin signals</p>
    </div>`;
}
</script>
<style>
@media(max-width:980px){ .responsive-2col{grid-template-columns:1fr !important} }
</style>
</body>
</html>
